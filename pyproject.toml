[project]
name = "regdelta"
version = "0.1.0"
description = "Experimental evidence-first ledger for Spanish financial regulatory sources."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.11", "mypy>=1.15"]

[project.scripts]
regdelta = "regdelta.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regdelta"]

[tool.hatch.build.targets.sdist]
only-include = ["src/regdelta", "pyproject.toml", "README.md", "CONTRIBUTING.md", "SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
files = ["src/regdelta/http.py", "src/regdelta/rawstore.py", "src/regdelta/util.py"]
follow_imports = "silent"
check_untyped_defs = true
