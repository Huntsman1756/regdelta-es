[project]
name = "regdelta"
version = "0.1.0"
description = "RegDelta G0-A/G0-B: factual watcher and immutable evidence store for Spanish financial regulatory sources."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
regdelta = "regdelta.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regdelta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
